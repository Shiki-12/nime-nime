name: Deploy EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: server-update

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            set -euo pipefail

            echo "==> Go to project directory"
            cd /var/www/nime-nime

            echo "==> Pull latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Install dependencies"
            npm ci

            echo "==> Sync Prisma database"
            npx prisma generate
            npx prisma db push

            echo "==> Build Next.js app"
            npm run build

            echo "==> Restart PM2 services"
            pm2 restart nime --update-env
            pm2 restart nimenime-bot --update-env

            echo "==> Save PM2 process list"
            pm2 save

            echo "==> Deployment finished"